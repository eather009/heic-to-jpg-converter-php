# Global httpd timeouts — /etc/httpd/conf.d/heic-converter-timeouts.conf
# Amazon Linux 2023 / RHEL / httpd 2.4
#
# Do NOT use <Proxy> + ProxySet here — it breaks on many httpd builds (AH00526).
# ProxyTimeout applies to php-fpm via SetHandler proxy:unix:...|fcgi://localhost

Timeout 600
ProxyTimeout 600

<IfModule mod_fcgid.c>
    FcgidIOTimeout 600
    FcgidConnectTimeout 600
    FcgidBusyTimeout 600
    FcgidMaxRequestLen 20971520
</IfModule>

# --- PHP-FPM: /etc/php-fpm.d/www.conf ---
#   listen = /run/php-fpm/www.sock
#   request_terminate_timeout = 600
#
# sudo systemctl restart php-fpm httpd
