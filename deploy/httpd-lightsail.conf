# Apache httpd — HEIC converter (Amazon Linux 2023 / Lightsail)
#
# Socket (from your server):
#   listen = /run/php-fpm/www.sock
#
# Apply timeouts from apache-timeouts.conf first, then this vhost if needed.

# --- Inside <VirtualHost *:443> or *:80> ---

DocumentRoot /var/www/html/heic-to-jpg-converter-php

<Directory /var/www/html/heic-to-jpg-converter-php>
    AllowOverride All
    Require all granted
</Directory>

LimitRequestBody 20971520

<FilesMatch \.php$>
    SetHandler "proxy:unix:/run/php-fpm/www.sock|fcgi://localhost"
</FilesMatch>

# Timeouts: set globally in apache-timeouts.conf (Timeout 600 + ProxyTimeout 600)
